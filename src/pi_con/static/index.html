<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi-Con</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #667085; --line: #e3e6ec;
    --accent: #3b6cf6; --wake: #12a150; --error: #d92d20; --track: #e8ebf1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b22; --text: #eceef3; --muted: #98a1b3; --line: #262a34;
      --accent: #7a9bff; --wake: #3ddc84; --error: #ff6b5e; --track: #262a34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.25rem; }
  .pill { padding: 4px 12px; border-radius: 999px; font-size: .85rem; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
  .pill.ok { color: var(--wake); border-color: var(--wake); }
  .pill.bad { color: var(--error); border-color: var(--error); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
  #heard { font-size: clamp(1.6rem, 6vw, 3rem); font-weight: 650; min-height: 1.3em; margin: 6px 0 2px; word-break: break-word; }
  #heard.live { color: var(--accent); }
  #heard::after {
    content: ""; display: inline-block; width: .08em; height: 1em; margin-left: .08em; vertical-align: -.12em;
    background: currentColor; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  button {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }
  button.on { background: var(--wake); border-color: var(--wake); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--wake) 25%, transparent); } }
  #heard-meta { color: var(--muted); font-size: .9rem; min-height: 1.2em; }
  .meters { display: grid; gap: 14px; }
  .meter-head { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 4px; }
  .meter-head span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .bar { height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
  #score-bar.hot { background: var(--wake); }
  #threshold { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: .6; left: 50%; }
  ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 45vh; overflow-y: auto; }
  li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li time { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; flex: none; }
  .tag { flex: none; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; background: var(--muted); }
  .tag.wake { background: var(--wake); } .tag.said { background: var(--accent); } .tag.error { background: var(--error); }
  li span.text { word-break: break-word; }
  details summary { cursor: pointer; font-weight: 600; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
  button.danger { background: transparent; color: var(--error); border-color: var(--error); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 8px 0; font-size: .9rem; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }
  dd.warn { color: var(--error); font-weight: 600; }
  pre { margin: 8px 0 0; max-height: 40vh; overflow: auto; font-size: .78rem; line-height: 1.35; white-space: pre-wrap; color: var(--muted); }
  .empty { color: var(--muted); padding: 8px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pi-Con</h1>
    <span id="pill" class="pill">connecting…</span>
  </header>

  <section class="card">
    <div class="card-head">
      <div class="label">Last heard</div>
      <button id="talk" type="button">🎤 Speak</button>
    </div>
    <div id="heard"></div>
    <div id="heard-meta">Waiting for the wake word</div>
  </section>

  <section class="card meters">
    <div>
      <div class="meter-head"><span>Microphone level</span><span id="level-val">–</span></div>
      <div class="track"><div id="level-bar" class="bar"></div></div>
    </div>
    <div>
      <div class="meter-head"><span>Wake word score</span><span id="score-val">–</span></div>
      <div class="track"><div id="score-bar" class="bar"></div><div id="threshold" title="threshold"></div></div>
    </div>
  </section>

  <section class="card">
    <details id="debug">
      <summary>Debug &amp; controls</summary>
      <div class="toolbar">
        <button id="restart-audio" class="secondary" type="button">Restart microphone</button>
        <button id="restart-app" class="danger" type="button">Restart app</button>
      </div>
      <div id="control-msg" class="label"></div>
      <dl id="debug-info"></dl>
      <div class="label">Recent logs</div>
      <pre id="debug-log"></pre>
    </details>
  </section>

  <section class="card">
    <div class="label">History</div>
    <ol id="log"><li class="empty">Nothing yet.</li></ol>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const MAX_ROWS = 100;
  let lastScoreAt = 0, connected = false, failed = false;

  function setPill() {
    const pill = $("pill");
    let text = "connecting…", cls = "pill";
    if (failed) { text = "error"; cls += " bad"; }
    else if (!connected) { text = "disconnected"; cls += " bad"; }
    else if (Date.now() - lastScoreAt > 3000) { text = "no audio"; cls += " bad"; }
    else if (capturing) { text = "listening to you"; cls += " ok"; }
    else { text = "waiting for wake word"; cls += " ok"; }
    pill.textContent = text; pill.className = cls;
  }

  function stamp(seconds) {
    return new Date(seconds * 1000).toLocaleTimeString([], { hour12: false });
  }

  function addRow(event, tag, tagClass, text) {
    const log = $("log");
    const empty = log.querySelector(".empty");
    if (empty) empty.remove();
    const row = document.createElement("li");
    const time = document.createElement("time"); time.textContent = stamp(event.time);
    const badge = document.createElement("span"); badge.className = "tag " + tagClass; badge.textContent = tag;
    const body = document.createElement("span"); body.className = "text"; body.textContent = text;
    row.append(time, badge, body);
    log.prepend(row);
    while (log.children.length > MAX_ROWS) log.lastChild.remove();
  }

  // Typewriter: the text on screen catches up with `target` one character at a time.
  let target = "", shown = 0, capturing = false;
  const TYPE_DELAY_MS = 35;

  function typeInto(text) {
    let common = 0;
    while (common < Math.min(shown, text.length) && text[common] === target[common]) common++;
    target = text;
    shown = Math.min(shown, common);  // the recogniser revised earlier words: retype from the change
    renderHeard();
  }

  function renderHeard() {
    const el = $("heard");
    el.textContent = target.slice(0, shown);
    el.classList.toggle("live", capturing);
  }

  setInterval(() => {
    if (shown < target.length) { shown++; renderHeard(); }
  }, TYPE_DELAY_MS);

  function heard(event, text, meta) {
    typeInto(text);
    $("heard-meta").textContent = meta + " · " + stamp(event.time);
  }

  function setCapturing(active) {
    capturing = active;
    $("talk").classList.toggle("on", active);
    $("talk").disabled = active;
    $("talk").textContent = active ? "Listening…" : "🎤 Speak";
    if (active) { typeInto(""); $("heard-meta").textContent = "Speak now"; }
    renderHeard();
  }

  $("talk").onclick = async () => {
    const reply = await fetch("/listen", { method: "POST" }).catch(() => null);
    if (!reply || !reply.ok) $("heard-meta").textContent = "Speech-to-text is not available";
  };

  function handle(event) {
    switch (event.type) {
      case "score": {
        lastScoreAt = Date.now();
        const score = event.score || 0, level = event.level || 0;
        $("score-bar").style.width = Math.min(100, score * 100) + "%";
        $("score-bar").classList.toggle("hot", score >= (event.threshold || 0.5));
        $("score-val").textContent = score.toFixed(2);
        $("level-bar").style.width = Math.min(100, Math.sqrt(level) * 150) + "%";
        $("level-val").textContent = level.toFixed(3);
        if (event.threshold != null) $("threshold").style.left = event.threshold * 100 + "%";
        break;
      }
      case "wake":
        $("heard-meta").textContent = "Wake word “" + event.word + "” detected · " + stamp(event.time);
        addRow(event, "WAKE", "wake", event.word + " (score " + event.score.toFixed(2) + ")");
        break;
      case "capture":
        setCapturing(event.active);
        break;
      case "partial":
        typeInto(event.text);
        break;
      case "transcript":
        heard(event, event.text, "Transcribed");
        addRow(event, "SAID", "said", event.text);
        break;
      case "status":
        failed = event.state === "error";
        addRow(event, failed ? "ERROR" : "INFO", failed ? "error" : "", event.message);
        break;
    }
    setPill();
  }

  async function control(path, label) {
    $("control-msg").textContent = label + "…";
    const reply = await fetch(path, { method: "POST" }).catch(() => null);
    $("control-msg").textContent = reply && reply.ok ? label + ": done" : label + ": failed";
  }
  $("restart-audio").onclick = () => control("/restart-audio", "Restarting the microphone");
  $("restart-app").onclick = () => {
    if (confirm("Restart the whole app? The page reconnects by itself.")) control("/restart-app", "Restarting the app");
  };

  function rows(info) {
    const a = info.audio || {}, sys = info.system || {};
    const age = a.last_block_age_s;
    return [
      ["Uptime", info.uptime_s + " s"],
      ["Mic stream", a.stream, a.stream !== "running"],
      ["Device", a.device + " @ " + a.capture_rate + " Hz"],
      ["Last audio block", age + " s ago", age > 2],
      ["Audio blocks", a.blocks], ["Overflows", a.overflows],
      ["Stalls / mic restarts", a.stalls + " / " + a.stream_restarts, a.stalls > 0],
      ["Last audio error", a.last_error || "–", !!a.last_error],
      ["CPU temp", sys.cpu_temp_c != null ? sys.cpu_temp_c + " °C" : "–"],
      ["Load", (sys.load || []).join(" ")], ["Memory", sys.memory_mb != null ? sys.memory_mb + " MB" : "–"],
    ];
  }

  async function refreshDebug() {
    if (!$("debug").open) return;
    try {
      const info = await (await fetch("/debug", { cache: "no-store" })).json();
      const list = $("debug-info"); list.replaceChildren();
      for (const [name, value, warn] of rows(info)) {
        const dt = document.createElement("dt"); dt.textContent = name;
        const dd = document.createElement("dd"); dd.textContent = value; if (warn) dd.className = "warn";
        list.append(dt, dd);
      }
      const log = $("debug-log"), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
      log.textContent = (info.log || []).join("\n");
      if (atEnd) log.scrollTop = log.scrollHeight;
    } catch (error) {
      $("debug-info").replaceChildren();
      $("debug-log").textContent = "Cannot reach the app: " + error;
    }
  }
  $("debug").addEventListener("toggle", refreshDebug);
  setInterval(refreshDebug, 2000);

  const source = new EventSource("/events");
  source.onopen = () => { connected = true; setPill(); };
  source.onerror = () => { connected = false; setPill(); };  // EventSource retries by itself
  source.onmessage = (message) => handle(JSON.parse(message.data));
  setInterval(setPill, 1000);
</script>
</body>
</html>
