[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pi-con"
version = "0.1.0"
description = "Portable wake-word command service for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "openwakeword>=0.6,<0.7",
  "sounddevice>=0.5,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pi-con = "pi_con.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
